<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalender – Hüttenbuch</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ink:     #1e1510;
      --paper:   #f7f2ea;
      --aged:    #e8dfc8;
      --rust:    #8b4513;
      --gold:    #b8860b;
      --pine:    #2d4a2d;
      --muted:   #7a6a58;
      --divider: #d4c9b0;
      --red:     #c0392b;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180,160,120,0.07) 28px, rgba(180,160,120,0.07) 29px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
      background: var(--ink); display: flex; flex-direction: column;
      padding: 2.5rem 1.8rem; z-index: 100; border-right: 3px solid var(--rust);
    }
    .sidebar-logo { font-family: 'Crimson Pro', serif; font-size: 1.4rem; color: var(--aged); line-height: 1.3; margin-bottom: 0.4rem; }
    .sidebar-logo span { color: var(--gold); font-style: italic; }
    .sidebar-sub { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; }
    .sidebar nav { display: flex; flex-direction: column; gap: 0.2rem; }
    .sidebar nav a {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem;
      color: rgba(232,223,200,0.65); text-decoration: none; font-size: 0.82rem;
      letter-spacing: 0.04em; border-radius: 3px; transition: background 0.15s, color 0.15s;
    }
    .sidebar nav a:hover, .sidebar nav a.active { background: rgba(139,69,19,0.25); color: var(--aged); }
    .sidebar nav a .ni { font-size: 1rem; width: 1.2rem; text-align: center; }
    .sidebar-footer { margin-top: auto; font-size: 0.65rem; color: rgba(122,106,88,0.4); letter-spacing: 0.1em; }

    /* ── MAIN ── */
    .main { margin-left: 220px; min-height: 100vh; }
    .page-header {
      padding: 3.5rem 3.5rem 2rem; border-bottom: 1px solid var(--divider);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .page-header h1 { font-family: 'Crimson Pro', serif; font-size: 2.8rem; font-weight: 300; color: var(--rust); }
    .page-header h1 em { font-style: italic; color: var(--ink); }
    .page-header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
    .header-date { font-size: 0.75rem; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
    .content { padding: 2.5rem 3.5rem; }

    /* ── LAYOUT ── */
    .kalender-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }

    /* ── STATUS BAR ── */
    .statusbar {
      margin-bottom: 1rem; padding: 0.7rem 1rem;
      border-radius: 2px; font-size: 0.82rem;
      display: flex; align-items: center; gap: 0.6rem;
      transition: all 0.3s;
    }
    .statusbar.leer { background: rgba(45,74,45,0.08); color: var(--pine); border: 1px solid rgba(45,74,45,0.2); }
    .statusbar.laden { background: rgba(184,134,11,0.08); color: var(--gold); border: 1px solid rgba(184,134,11,0.2); }
    .statusbar.fehler { background: rgba(192,57,43,0.08); color: var(--red); border: 1px solid rgba(192,57,43,0.2); }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FULLCALENDAR STYLING ── */
    #kalender-container {
      background: #fff; border: 1px solid var(--divider); border-radius: 2px; padding: 1.5rem;
    }
    .fc { font-family: 'DM Sans', sans-serif; }
    .fc .fc-toolbar-title { font-family: 'Crimson Pro', serif; font-size: 1.5rem; font-weight: 400; color: var(--rust); }
    .fc .fc-button-primary { background: var(--rust) !important; border-color: var(--rust) !important; font-size: 0.78rem !important; border-radius: 2px !important; }
    .fc .fc-button-primary:hover { background: #a0521a !important; border-color: #a0521a !important; }
    .fc .fc-button-primary:disabled { background: var(--muted) !important; border-color: var(--muted) !important; }
    .fc .fc-col-header-cell { background: var(--aged); }
    .fc .fc-col-header-cell-cushion { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0.5rem 0; }
    .fc .fc-daygrid-day-number { font-size: 0.8rem; color: var(--muted); text-decoration: none; padding: 4px 6px; }
    .fc .fc-daygrid-day.fc-day-today { background: rgba(184,134,11,0.08) !important; }
    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: var(--gold); font-weight: 500; }
    .fc-event { border-radius: 2px !important; border: none !important; font-size: 0.78rem !important; padding: 1px 4px !important; cursor: pointer; }
    .fc .fc-event.lock-event { opacity: 0.55; cursor: default; }
    .fc-event-title { font-weight: 400 !important; }

    /* ── RECHTE SEITENLEISTE ── */
    .sidebar-right { display: flex; flex-direction: column; gap: 1.2rem; }

    .info-card {
      background: #fff; border: 1px solid var(--divider);
      border-top: 3px solid var(--rust); border-radius: 2px; padding: 1.2rem 1.3rem;
    }
    .info-card.pine { border-top-color: var(--pine); }
    .info-card.gold { border-top-color: var(--gold); }
    .info-card h3 { font-family: 'Crimson Pro', serif; font-size: 1rem; font-weight: 600; margin-bottom: 0.9rem; }

    /* ── FORMULAR ── */
    .form-group { margin-bottom: 0.75rem; }
    .form-group label { display: block; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
    .form-group input {
      width: 100%; padding: 0.5rem 0.6rem;
      border: 1px solid var(--divider); border-radius: 2px;
      background: var(--paper); color: var(--ink);
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--rust); }
    .form-group input:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn { width: 100%; padding: 0.6rem; border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; transition: background 0.2s; margin-top: 0.3rem; }
    .btn-rust  { background: var(--rust);  color: #fff; }
    .btn-rust:hover  { background: #a0521a; }
    .btn-rust:disabled { background: var(--muted); cursor: not-allowed; }
    .btn-pine  { background: var(--pine);  color: #fff; }
    .btn-pine:hover  { background: #3d6b3d; }
    .btn-gray  { background: var(--divider); color: var(--muted); margin-top: 0.4rem; }
    .btn-gray:hover  { background: #c5b99e; }

    /* ── TIMER ── */
    .timer-box {
      display: none;
      background: #fff8ed;
      border: 2px solid var(--gold);
      border-radius: 2px;
      padding: 1rem 1.2rem;
      text-align: center;
    }
    .timer-box.aktiv { display: block; }
    .timer-label { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .timer-zahl {
      font-family: 'Crimson Pro', serif;
      font-size: 2.8rem; font-weight: 300; color: var(--gold); line-height: 1;
      margin-bottom: 0.2rem;
      transition: color 0.3s;
    }
    .timer-zahl.kritisch { color: var(--red); }
    .timer-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; }
    .timer-name { font-weight: 500; color: var(--ink); }

    /* ── BELEGUNGSLISTE ── */
    .belegung-liste { display: flex; flex-direction: column; gap: 0.6rem; }
    .belegung-eintrag {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0.6rem 0.7rem; background: var(--paper); border-radius: 2px;
      border-left: 3px solid var(--rust); font-size: 0.82rem;
    }
    .be-name { font-weight: 500; margin-bottom: 0.15rem; }
    .be-datum { color: var(--muted); font-size: 0.75rem; }
    .be-del { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 0.9rem; padding: 0 2px; transition: color 0.2s; }
    .be-del:hover { color: var(--red); }

    .leere-liste { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 0.5rem 0; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) { .kalender-layout { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .sidebar { width: 58px; padding: 1.2rem 0.7rem; }
      .sidebar-logo, .sidebar-sub, .sidebar nav a span, .sidebar-footer { display: none; }
      .sidebar nav a { justify-content: center; padding: 0.7rem; }
      .main { margin-left: 58px; }
      .content, .page-header { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">Hütten<span>buch</span></div>
    <div class="sidebar-sub">Verwaltung</div>
    <nav>
      <a href="index.html"><span class="ni">🏠</span><span>Übersicht</span></a>
      <a href="kalender.html" class="active"><span class="ni">📅</span><span>Kalender</span></a>
      <a href="index.html#geschichte"><span class="ni">📖</span><span>Geschichte</span></a>
      <a href="index.html#galerie"><span class="ni">🖼</span><span>Galerie</span></a>
      <a href="index.html#regeln"><span class="ni">📋</span><span>Regeln & Infos</span></a>
      <a href="index.html#kontakt"><span class="ni">✉️</span><span>Kontakt</span></a>
    </nav>
    <div class="sidebar-footer">© 2025 Familie Mustermann</div>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1>Belegungs<em>kalender</em></h1>
        <p>Wer ist wann in der Hütte?</p>
      </div>
      <div class="header-date" id="current-date"></div>
    </header>

    <div class="content">
      <div id="statusbar" class="statusbar laden">
        <span class="spin">⏳</span> Verbinde mit Datenbank…
      </div>

      <div class="kalender-layout">
        <div id="kalender-container">
          <div id="kalender"></div>
        </div>

        <div class="sidebar-right">

          <!-- Formular -->
          <div class="info-card" id="formular-card">
            <h3>➕ Belegung eintragen</h3>
            <div class="form-group">
              <label>Name / Familie</label>
              <input type="text" id="f-name" placeholder="z.B. Familie Müller"/>
            </div>
            <div class="form-group">
              <label>Von</label>
              <input type="date" id="f-von"/>
            </div>
            <div class="form-group">
              <label>Bis (Abreisetag)</label>
              <input type="date" id="f-bis"/>
            </div>
            <button class="btn btn-rust" id="btn-reservieren" onclick="reservierenStarten()">
              Reservieren & Timer starten
            </button>
          </div>

          <!-- Timer -->
          <div class="timer-box" id="timer-box">
            <div class="timer-label">⏱ Reservierung läuft ab in</div>
            <div class="timer-zahl" id="timer-zahl">10:00</div>
            <div class="timer-sub">
              <span class="timer-name" id="timer-name"></span><br/>
              <span id="timer-datum"></span>
            </div>
            <button class="btn btn-pine" onclick="buchungBestaetigen()">✓ Jetzt bestätigen</button>
            <button class="btn btn-gray" onclick="reservierungAbbrechen()">Abbrechen</button>
          </div>

          <!-- Aktuelle Belegungen -->
          <div class="info-card pine">
            <h3>📋 Belegungen</h3>
            <div class="belegung-liste" id="belegung-liste">
              <div class="leere-liste">Lädt…</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    // ════════════════════════════════════════════════
    //  ⚙️  HIER DEINE SUPABASE-ZUGANGSDATEN EINTRAGEN
    // ════════════════════════════════════════════════
    const SUPABASE_URL  = 'https://jvxlhlpqsiipplrwozje.supabase.co';   // z.B. https://xyz.supabase.co
    const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eGxobHBxc2lpcHBscndvemplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDI1MjMsImV4cCI6MjA5NDcxODUyM30.7RkkdCCh2tCBNDPjN_h6-zCSdX8NmGAkQnOjOVWTp3A';         // langer Schlüssel aus Settings → API
    // ════════════════════════════════════════════════

    const LOCK_MINUTEN  = 10;   // Wie lange der Timer läuft (Minuten)

    // ── Supabase Client ──
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── Session ID (eindeutig pro Browser-Tab) ──
    const SESSION_ID = Math.random().toString(36).slice(2);

    // ── Globale Variablen ──
    let kalender;
    let aktiverLock = null;     // { id, name, von, bis, laeuft_ab }
    let timerInterval = null;

    // ── Datum im Header ──
    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('de-DE', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    // ════════════════════════════════════════════════
    //  STATUS
    // ════════════════════════════════════════════════
    function status(text, typ = 'leer') {
      const el = document.getElementById('statusbar');
      el.className = 'statusbar ' + typ;
      el.innerHTML = text;
    }

    // ════════════════════════════════════════════════
    //  DATEN LADEN
    // ════════════════════════════════════════════════
    async function alleLaden() {
      status('<span class="spin">⏳</span> Lade Kalender…', 'laden');
      try {
        const jetzt = new Date().toISOString();

        // Belegungen laden
        const { data: belegungen, error: e1 } = await db
          .from('belegungen')
          .select('*')
          .order('von');
        if (e1) throw e1;

        // Aktive Locks laden (nur noch nicht abgelaufene, nicht von dieser Session)
        const { data: locks, error: e2 } = await db
          .from('locks')
          .select('*')
          .gt('laeuft_ab', jetzt)
          .neq('session_id', SESSION_ID);
        if (e2) throw e2;

        kalenderAktualisieren(belegungen, locks);
        listeAktualisieren(belegungen);
        status('✓ Datenbank verbunden · ' + belegungen.length + ' Belegung(en) geladen', 'leer');

      } catch (err) {
        status('✗ Datenbankfehler: ' + err.message, 'fehler');
        console.error(err);
      }
    }

    // ════════════════════════════════════════════════
    //  KALENDER ANZEIGE
    // ════════════════════════════════════════════════
    function kalenderAktualisieren(belegungen, locks) {
      kalender.removeAllEvents();

      // Bestätigte Belegungen (dunkelrot)
      belegungen.forEach(b => {
        kalender.addEvent({
          id: 'b-' + b.id,
          title: b.name,
          start: b.von,
          end: b.bis,
          backgroundColor: '#8b4513',
          borderColor: '#8b4513',
          extendedProps: { typ: 'belegung', dbId: b.id }
        });
      });

      // Fremd-Locks (halbtransparent, Streifen)
      locks.forEach(l => {
        kalender.addEvent({
          id: 'l-' + l.id,
          title: '🔒 ' + l.name + ' (reserviert)',
          start: l.von,
          end: l.bis,
          backgroundColor: '#b8860b',
          borderColor: '#b8860b',
          classNames: ['lock-event'],
          extendedProps: { typ: 'lock' }
        });
      });

      // Eigener aktiver Lock (falls vorhanden)
      if (aktiverLock) {
        kalender.addEvent({
          id: 'mein-lock',
          title: '⏱ ' + aktiverLock.name + ' (deine Reservierung)',
          start: aktiverLock.von,
          end: aktiverLock.bis,
          backgroundColor: '#2d4a2d',
          borderColor: '#2d4a2d',
          extendedProps: { typ: 'eigener-lock' }
        });
      }
    }

    function listeAktualisieren(belegungen) {
      const el = document.getElementById('belegung-liste');
      if (!belegungen || belegungen.length === 0) {
        el.innerHTML = '<div class="leere-liste">Noch keine Belegungen.</div>';
        return;
      }
      el.innerHTML = belegungen.map(b => `
        <div class="belegung-eintrag">
          <div>
            <div class="be-name">${b.name}</div>
            <div class="be-datum">
              ${new Date(b.von).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})} –
              ${new Date(b.bis).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
            </div>
          </div>
          <button class="be-del" onclick="belegungLoeschen('${b.id}')" title="Löschen">✕</button>
        </div>
      `).join('');
    }

    // ════════════════════════════════════════════════
    //  ÜBERSCHNEIDUNG PRÜFEN
    // ════════════════════════════════════════════════
    async function ueberschneidungPruefen(von, bis) {
      const jetzt = new Date().toISOString();

      // Belegungen prüfen
      const { data: bel } = await db
        .from('belegungen')
        .select('name, von, bis')
        .lt('von', bis)
        .gt('bis', von);

      if (bel && bel.length > 0)
        return `Zeitraum belegt durch: ${bel[0].name} (${bel[0].von} – ${bel[0].bis})`;

      // Aktive Locks anderer Sessions prüfen
      const { data: locks } = await db
        .from('locks')
        .select('name, von, bis')
        .lt('von', bis)
        .gt('bis', von)
        .gt('laeuft_ab', jetzt)
        .neq('session_id', SESSION_ID);

      if (locks && locks.length > 0)
        return `Zeitraum gerade von ${locks[0].name} reserviert – bitte warten.`;

      return null; // frei!
    }

    // ════════════════════════════════════════════════
    //  RESERVIERUNG STARTEN (Lock anlegen + Timer)
    // ════════════════════════════════════════════════
    async function reservierenStarten() {
      const name = document.getElementById('f-name').value.trim();
      const von  = document.getElementById('f-von').value;
      const bis  = document.getElementById('f-bis').value;

      if (!name || !von || !bis) { alert('Bitte alle Felder ausfüllen!'); return; }
      if (von >= bis) { alert('Das Enddatum muss nach dem Startdatum liegen.'); return; }

      status('<span class="spin">⏳</span> Prüfe Verfügbarkeit…', 'laden');

      const konflikt = await ueberschneidungPruefen(von, bis);
      if (konflikt) {
        status('✗ ' + konflikt, 'fehler');
        return;
      }

      // Lock in DB schreiben
      const laueftAb = new Date(Date.now() + LOCK_MINUTEN * 60 * 1000).toISOString();
      const { data: lock, error } = await db
        .from('locks')
        .insert({ name, von, bis, session_id: SESSION_ID, laeuft_ab: laueftAb })
        .select()
        .single();

      if (error) { status('✗ Fehler beim Reservieren: ' + error.message, 'fehler'); return; }

      aktiverLock = lock;
      status('⏱ Zeitraum reserviert – bitte innerhalb von ' + LOCK_MINUTEN + ' Minuten bestätigen.', 'laden');

      // Formular deaktivieren
      formularAktivieren(false);

      // Timer anzeigen
      document.getElementById('timer-name').textContent = name;
      document.getElementById('timer-datum').textContent =
        new Date(von).toLocaleDateString('de-DE',{day:'2-digit',month:'short'}) + ' – ' +
        new Date(bis).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
      document.getElementById('timer-box').classList.add('aktiv');

      timerStarten(new Date(laueftAb));
      alleLaden();
    }

    // ════════════════════════════════════════════════
    //  TIMER
    // ════════════════════════════════════════════════
    function timerStarten(ablaufZeit) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const restMs = ablaufZeit - Date.now();
        if (restMs <= 0) {
          clearInterval(timerInterval);
          timerAbgelaufen();
          return;
        }
        const min = Math.floor(restMs / 60000);
        const sek = Math.floor((restMs % 60000) / 1000);
        const el = document.getElementById('timer-zahl');
        el.textContent = String(min).padStart(2,'0') + ':' + String(sek).padStart(2,'0');
        el.classList.toggle('kritisch', restMs < 60000);
      }, 500);
    }

    async function timerAbgelaufen() {
      document.getElementById('timer-zahl').textContent = '00:00';
      if (aktiverLock) {
        await db.from('locks').delete().eq('id', aktiverLock.id);
        aktiverLock = null;
      }
      document.getElementById('timer-box').classList.remove('aktiv');
      formularAktivieren(true);
      status('⚠ Reservierung abgelaufen. Bitte erneut versuchen.', 'fehler');
      alleLaden();
    }

    // ════════════════════════════════════════════════
    //  BUCHUNG BESTÄTIGEN
    // ════════════════════════════════════════════════
    async function buchungBestaetigen() {
      if (!aktiverLock) return;
      clearInterval(timerInterval);
      status('<span class="spin">⏳</span> Buchung wird gespeichert…', 'laden');

      // Nochmal prüfen ob Lock noch aktuell ist
      const jetzt = new Date().toISOString();
      const { data: lockCheck } = await db
        .from('locks')
        .select('id')
        .eq('id', aktiverLock.id)
        .gt('laeuft_ab', jetzt)
        .single();

      if (!lockCheck) {
        status('✗ Reservierung abgelaufen – bitte erneut versuchen.', 'fehler');
        aktiverLock = null;
        document.getElementById('timer-box').classList.remove('aktiv');
        formularAktivieren(true);
        alleLaden();
        return;
      }

      // Buchung schreiben
      const { error: e1 } = await db.from('belegungen').insert({
        name: aktiverLock.name,
        von:  aktiverLock.von,
        bis:  aktiverLock.bis
      });

      // Lock löschen
      await db.from('locks').delete().eq('id', aktiverLock.id);

      if (e1) { status('✗ Fehler beim Speichern: ' + e1.message, 'fehler'); return; }

      aktiverLock = null;
      document.getElementById('timer-box').classList.remove('aktiv');
      formularAktivieren(true);

      // Felder leeren
      document.getElementById('f-name').value = '';
      document.getElementById('f-von').value  = '';
      document.getElementById('f-bis').value  = '';

      status('✓ Buchung gespeichert!', 'leer');
      alleLaden();
    }

    // ════════════════════════════════════════════════
    //  RESERVIERUNG ABBRECHEN
    // ════════════════════════════════════════════════
    async function reservierungAbbrechen() {
      clearInterval(timerInterval);
      if (aktiverLock) {
        await db.from('locks').delete().eq('id', aktiverLock.id);
        aktiverLock = null;
      }
      document.getElementById('timer-box').classList.remove('aktiv');
      formularAktivieren(true);
      status('Reservierung abgebrochen.', 'leer');
      alleLaden();
    }

    // ════════════════════════════════════════════════
    //  BELEGUNG LÖSCHEN
    // ════════════════════════════════════════════════
    async function belegungLoeschen(id) {
      if (!confirm('Belegung wirklich löschen?')) return;
      const { error } = await db.from('belegungen').delete().eq('id', id);
      if (error) { alert('Fehler: ' + error.message); return; }
      alleLaden();
    }

    // ════════════════════════════════════════════════
    //  FORMULAR AKTIVIEREN / DEAKTIVIEREN
    // ════════════════════════════════════════════════
    function formularAktivieren(aktiv) {
      ['f-name','f-von','f-bis'].forEach(id => {
        document.getElementById(id).disabled = !aktiv;
      });
      document.getElementById('btn-reservieren').disabled = !aktiv;
    }

    // ════════════════════════════════════════════════
    //  EIGENE LOCKS BEI SEITENENDE AUFRÄUMEN
    // ════════════════════════════════════════════════
    window.addEventListener('beforeunload', async () => {
      if (aktiverLock) {
        // Einfach feuern (kein await – Seite schließt sofort)
        db.from('locks').delete().eq('id', aktiverLock.id);
      }
    });

    // ════════════════════════════════════════════════
    //  KALENDER INITIALISIEREN
    // ════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      kalender = new FullCalendar.Calendar(document.getElementById('kalender'), {
        initialView:   'dayGridMonth',
        locale:        'de',
        firstDay:      1,
        height:        'auto',
        events:        [],
        eventClick: async function(info) {
          const typ = info.event.extendedProps.typ;
          if (typ === 'lock') return; // Fremd-Locks nicht anfassbar
          if (typ === 'belegung') {
            if (confirm(`"${info.event.title}" löschen?`)) {
              await belegungLoeschen(info.event.extendedProps.dbId);
            }
          }
        },
        headerToolbar: {
          left:   'prev,next today',
          center: 'title',
          right:  'dayGridMonth,listMonth'
        },
        buttonText: { today: 'Heute', month: 'Monat', list: 'Liste' }
      });

      kalender.render();
      alleLaden();

      // Kalender alle 30 Sek. aktualisieren (andere Nutzer sehen Änderungen)
      setInterval(alleLaden, 30000);
    });
  </script>

</body>
</html>
